name: door-packet-proof

on:
  pull_request:
  push:
    branches:
      - main
      - feat/door-packet-001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/door-packet.test.mjs
      - run: node --check door-packet.js
